[project]
name = "leetcode-vim"
version = "0.1.0"
description = "CLI tooling for solving LeetCode in Vim"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["browser-cookie3>=0.17.1", "keyring>=24.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2"]

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
leetcodevim = "leetcode_vim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

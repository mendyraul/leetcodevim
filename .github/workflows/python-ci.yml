name: python-ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install terminal editors on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y vim neovim g++
      - name: Install terminal editors on macOS
        if: runner.os == 'macOS'
        run: brew install neovim
      - name: Install package and dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Static checks
        run: |
          python -m compileall -q src tests scripts
          ruff check src tests scripts
      - name: Unit and headless editor integration tests
        run: pytest -q
      - name: Build package
        run: python -m build
      - name: Verify installed wheel and editor runtime
        run: python scripts/smoke_wheel.py
